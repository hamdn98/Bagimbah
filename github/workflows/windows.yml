name: Build Windows EXE
on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pillow
      - run: python test_core.py
      - run: python make_icon.py
      - run: pyinstaller --onefile --noconsole --name LanShare --icon icon.ico --add-data "icon.ico;." app.py
      - uses: actions/upload-artifact@v4
        with:
          name: LanShare-windows
          path: windows/dist/LanShare.exe
